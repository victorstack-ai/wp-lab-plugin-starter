name: Release - Build and publish plugin releases

on:
  push:
    tags:
      - 'v*'
      - 'v*-stable'

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, intl, zip
          tools: composer:v2

      - name: Get tag name
        id: get_tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=$(echo ${{ env.TAG }} | sed 's/^v//' | sed 's/-stable$//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Create build directory
        run: |
          mkdir -p build/plugin-starter-template
          cp -R *.php README.md LICENSE CHANGELOG.md readme.txt composer.json build/plugin-starter-template/
          cp -R admin includes languages vendor build/plugin-starter-template/
          mkdir -p build/plugin-starter-template/assets/banner build/plugin-starter-template/assets/icon build/plugin-starter-template/assets/screenshots
          if [ -d "assets/banner" ]; then cp -R assets/banner/* build/plugin-starter-template/assets/banner/; fi
          if [ -d "assets/icon" ]; then cp -R assets/icon/* build/plugin-starter-template/assets/icon/; fi
          if [ -d "assets/screenshots" ]; then cp -R assets/screenshots/* build/plugin-starter-template/assets/screenshots/; fi

      - name: Create ZIP file
        run: |
          cd build
          zip -r ../plugin-starter-template-${{ env.VERSION }}.zip plugin-starter-template -x "*.DS_Store" -x "*.git*"
          cd ..

      - name: Extract changelog
        id: extract_changelog
        run: |
          CHANGELOG=$(grep -A 20 "#### \[${{ env.VERSION }}\]" CHANGELOG.md | sed -n '/####/,/####/p' | sed '$d')
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: plugin-starter-template-${{ env.VERSION }}.zip
          name: v${{ env.VERSION }} - Plugin Starter Template
          draft: false
          prerelease: false
          body: |
            # Plugin Starter Template v${{ env.VERSION }}

            ${{ env.CHANGELOG }}

            [View full changelog](https://github.com/wpallstars/plugin-starter-template/blob/main/CHANGELOG.md)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
